  l=document.createElement('link');l.rel='preload';l.as='fetch';l.href='config.json';l.crossOrigin='anonymous';h.appendChild(l);   /* the API discovery starts at once, not after app.js */
  l=document.createElement('link');l.rel='preload';l.as='style';l.href='app.css';l.onload=function(){this.onload=null;this.rel='stylesheet'};h.appendChild(l);

    <button class="icon-btn" id="theme" type="button" aria-label="پوسته‌ی تیره"><svg class="ic"><use href="#i-moon"/></svg></button>
  </header>

  <div id="tgline" class="tgline" hidden><i class="mk" aria-hidden="true"></i><span>این فهرست در تلگرام کامل‌تر است.</span><a class="tgl-open" id="tgl-open" href="https://t.me/Michael_chatbot?start=repofa" data-ext="tg" target="_blank" rel="noopener noreferrer">در تلگرام باز کنید</a><button type="button" class="link" id="tgl-login" data-scope="chat" hidden>ورود با تلگرام</button><button type="button" class="icon-btn" id="tgl-x" aria-label="بستن"><svg class="ic"><use href="#i-close"/></svg></button></div>
  <div id="notice" class="notice" role="status" hidden><span id="notice-t"></span><button type="button" class="icon-btn" id="notice-x" aria-label="بستن پیام"><svg class="ic"><use href="#i-close"/></svg></button></div>

  <!-- DOM/Tab order: list → detail → filters; the grid places filters at the start edge on desktop -->
  <div class="shell">
    <main class="main" id="main">
      <div class="toolbar" id="toolbar">
        <div class="tb-row">
          <h2 class="scope" id="scope-h">همه‌ی پروژه‌ها</h2>
          <button type="button" class="scope-x" id="scope-x" hidden><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
          <span class="count" id="count" aria-live="polite"></span>
          <div class="seg" id="sort" role="group" aria-label="مرتب‌سازی">
            <button type="button" data-sort="new" aria-pressed="true">جدیدترین</button>
            <button type="button" data-sort="stars" aria-pressed="false">پراستاره‌ترین</button>
            <button type="button" data-sort="views" aria-pressed="false" hidden>پربازدیدترین</button>
          </div>
          <div class="seg" id="fav-seg" role="group" aria-label="نوع ذخیره" hidden>
            <button type="button" data-fs="" aria-pressed="true">همه</button>
            <button type="button" data-fs="l" aria-pressed="false">بعداً</button>
            <button type="button" data-fs="f" aria-pressed="false">علاقه‌مندی</button>
          </div>
        </div>
        <div class="tokens" id="tokens" hidden></div>
      </div>

      <section id="pubs" class="pubs" aria-label="ناشرها" hidden></section>
      <section id="chat" class="chat" aria-label="گفت‌وگو با مایکل" hidden></section>
      <div id="list" class="list" role="list" aria-label="پروژه‌ها" tabindex="-1">
        <div class="row skel" aria-hidden="true"><i style="width:44%"></i><i style="width:88%"></i><i style="width:58%"></i></div>
        <div class="row skel" aria-hidden="true"><i style="width:36%"></i><i style="width:80%"></i><i style="width:52%"></i></div>
        <div class="row skel" aria-hidden="true"><i style="width:50%"></i><i style="width:92%"></i><i style="width:46%"></i></div>
        <div class="row skel" aria-hidden="true"><i style="width:40%"></i><i style="width:76%"></i><i style="width:60%"></i></div>
        <div class="row skel" aria-hidden="true"><i style="width:47%"></i><i style="width:84%"></i><i style="width:55%"></i></div>
        <div class="row skel" aria-hidden="true"><i style="width:33%"></i><i style="width:90%"></i><i style="width:50%"></i></div>
        <div class="row skel" aria-hidden="true"><i style="width:42%"></i><i style="width:86%"></i><i style="width:48%"></i></div>
      </div>
      <div id="sentinel" aria-hidden="true"></div>
      <div id="state" class="state" hidden></div>
      <div class="fav-tools" id="fav-tools" hidden>
        <button type="button" class="btn" data-export="copy"><svg class="ic" aria-hidden="true"><use href="#i-copy"/></svg>کپی فهرست به‌صورت متن</button>
        <button type="button" class="btn" data-export="share"><svg class="ic" aria-hidden="true"><use href="#i-send"/></svg>ارسال در تلگرام</button>
      </div>
      <noscript><p class="state">این فهرست بدون جاوااسکریپت کار نمی‌کند.</p></noscript>
    </main>

    <aside class="pane" id="pane" aria-label="جزئیات پروژه" tabindex="-1"></aside>

    <nav class="side" id="side" aria-label="فیلترها">
      <div class="side-sec" id="side-scopes">
        <ul class="nav-list">
          <li><button type="button" class="nav" data-scope="all"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg><span>همه‌ی پروژه‌ها</span><b class="n" id="n-all"></b></button></li>
          <li hidden><button type="button" class="nav" data-scope="chat" id="nav-chat"><svg class="ic" aria-hidden="true"><use href="#i-prompt"/></svg><span>گفت‌وگو با مایکل</span></button></li>
          <li><button type="button" class="nav" data-scope="pubs" id="nav-pubs"><svg class="ic" aria-hidden="true"><use href="#i-users"/></svg><span>ناشرها</span></button></li>
          <li><button type="button" class="nav" data-scope="fav"><svg class="ic" aria-hidden="true"><use href="#i-bm"/></svg><span>ذخیره‌شده</span><b class="n" id="n-fav"></b></button></li>
        </ul>
      </div>
      <div class="side-sec"><h2 class="side-h" id="h-cats">دسته‌ها</h2><ul class="nav-list" id="cat-list" aria-labelledby="h-cats"></ul></div>
      <div class="side-sec" id="sec-cols"><h2 class="side-h" id="h-cols">مجموعه‌ها</h2><ul class="nav-list" id="col-list" aria-labelledby="h-cols"></ul></div>
      <div class="side-sec"><h2 class="side-h" id="h-langs">زبان‌ها</h2><ul class="nav-list" id="lang-list" aria-labelledby="h-langs"></ul></div>
      <div class="side-sec"><h2 class="side-h" id="h-tags">برچسب‌های پرکاربرد</h2><ul class="nav-list tag-list" id="tag-list" aria-labelledby="h-tags"></ul></div>
      <p class="side-foot"><i class="mk" aria-hidden="true"></i>داده از کانال <a href="https://t.me/RepoFA" data-ext="tg"><bdi dir="ltr">t.me/RepoFA</bdi></a><br><span id="updated"></span></p>
    </nav>
  </div>

  <nav class="tabs" id="tabs" aria-label="بخش‌ها">
    <button type="button" data-tab="all" aria-current="page"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg><span>فهرست</span></button>
    <button type="button" data-tab="cats"><svg class="ic" aria-hidden="true"><use href="#i-filter"/></svg><span>فیلترها</span></button>
    <button type="button" data-tab="pubs" id="tab-pubs"><svg class="ic" aria-hidden="true"><use href="#i-users"/></svg><span>ناشرها</span></button>
    <button type="button" data-tab="chat" id="tab-chat" hidden><svg class="ic" aria-hidden="true"><use href="#i-prompt"/></svg><span>گفت‌وگو</span></button>
    <button type="button" data-tab="fav"><svg class="ic" aria-hidden="true"><use href="#i-bm"/></svg><span>ذخیره‌شده</span><b id="fav-n" hidden></b></button>
  </nav>
</div>

<div class="sheet-root" id="sheet-root" aria-hidden="true">
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-title" tabindex="-1"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"><span class="t-msg" id="t-msg"></span><button type="button" class="t-act" id="t-act" hidden>بازگردانی</button></div>
<script src="app.js" defer></script>
